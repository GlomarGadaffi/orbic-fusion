[package]
name = "fusion-core"
version = "0.1.0"
edition = "2024"
license = "MIT"
description = "Envelope schema + pluggable Sink for orbic-fusion"

[dependencies]
serde = { version = "1", features = ["derive"] }
serde_json = "1"
base64 = "0.22"
tokio = { version = "1", features = ["net", "io-util", "time", "sync", "rt"] }

[dev-dependencies]
tokio = { version = "1", features = ["macros", "rt-multi-thread", "net", "io-util", "time", "sync"] }
